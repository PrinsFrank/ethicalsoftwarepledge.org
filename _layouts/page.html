---
layout: default
---

<article>
  <div>
    {{ content }}
  </div>
</article>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('h1[id], h2[id], h3[id], h4[id] h5[id] h6[id]').forEach((heading) => {
      const anchor = document.createElement('a');
      anchor.href = `${window.location.origin}${window.location.pathname}#${heading.id}`;
      anchor.textContent = '🔗';
      anchor.addEventListener('click', async() => navigator.clipboard.writeText(anchor.href))

      heading.prepend(anchor);
    })
  })
</script>
